name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # Needed to push the packaged chart to the GitHub Container Registry (OCI).
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart to GHCR
        run: |
          chart_package=$(ls ./*.tgz)
          helm push "$chart_package" "oci://ghcr.io/${{ github.repository_owner }}/charts"